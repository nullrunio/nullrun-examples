name: smoke

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every example
        run: |
          python -m compileall -q examples/
          echo "OK: all examples parse"

  smoke-test:
    name: SDK init smoke (no real call)
    runs-on: ubuntu-latest
    needs: syntax-check
    # Bring the secret into a job-level env so the step-level if below
    # can check env.<var> != ''. GitHub Actions does not allow secrets.*
    # in any if: expression (job OR step level -- run 31504058183 still
    # errored at line 38, col 13 with the same 'Unrecognized named-value:
    # secrets' after the move from job-level to step-level if).
    env:
      SMOKE_API_KEY: ${{ secrets.NULLRUN_API_KEY_SMOKE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK
        run: pip install nullrun
      - name: Run smoke test
        if: ${{ env.SMOKE_API_KEY != '' }}
        env:
          NULLRUN_API_KEY: ${{ secrets.NULLRUN_API_KEY_SMOKE }}
          NULLRUN_API_URL: ${{ secrets.NULLRUN_API_URL }}
        run: python examples/smoke_test.py

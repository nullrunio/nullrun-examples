name: smoke

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every example
        run: |
          python -m compileall -q examples/
          echo "OK: all examples parse"

  smoke-test:
    name: SDK init smoke (no real call)
    runs-on: ubuntu-latest
    needs: syntax-check
    # Runs only when the repo secret NULLRUN_API_KEY_SMOKE is set, so the
    # workflow does not fail on forks / public PRs without credentials.
    if: ${{ secrets.NULLRUN_API_KEY_SMOKE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK
        run: pip install nullrun
      - name: Run smoke test
        env:
          NULLRUN_API_KEY: ${{ secrets.NULLRUN_API_KEY_SMOKE }}
          NULLRUN_API_URL: ${{ secrets.NULLRUN_API_URL }}
        run: python examples/smoke_test.py
